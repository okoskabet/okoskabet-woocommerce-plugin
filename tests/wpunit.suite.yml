# Codeception Test Suite Configuration

# suite for WordPress unit tests.
# Load WordPress and unit test classes that rely on it.
class_name: WpunitTester
modules:
    enabled:
        # see https://github.com/lucatume/wp-browser#modules
        - WPLoader        # loads and configures a blank WordPress installation
        - \Helper\Wpunit
# tests/wpunit/_bootstrap.php, loaded once WordPress is up. Without this line
# Codeception never read it. It picks the order storage for the run (HPOS).
bootstrap: _bootstrap.php
